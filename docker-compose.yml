version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QUANT_API_HOST=0.0.0.0
      - QUANT_API_PORT=8000
      - QUANT_API_URL=http://localhost:8000
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - DEFAULT_CURRENCY=COP
      - DEFAULT_TIMEZONE=America/Bogota
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quant_ai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_DEFAULT_CURRENCY=COP
      - NEXT_PUBLIC_DEFAULT_TIMEZONE=America/Bogota
    depends_on:
      backend:
        condition: service_healthy
